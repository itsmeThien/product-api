version: '3.8'

# ==============================================================================
# PRODUCTION DOCKER COMPOSE
# Chạy container lấy trực tiếp image từ Docker Hub trên Local Docker Engine
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database Container
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: nammongodb-prod
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=product_db
    volumes:
      - mongodb_prod_data:/data/db
    networks:
      - product-prod-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Product API Container (Kéo từ Docker Hub)
  # ----------------------------------------------------------------------------
  product-api:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/product-api:latest
    container_name: product-api-prod
    pull_policy: always
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/product_db
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - product-prod-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. Watchtower: Tự động hóa CD (Docker Hub -> Local Docker Engine)
  # Watchtower tự động dò tìm image mới trên Docker Hub và auto-update container
  # ----------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower-auto-cd
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=30
      - WATCHTOWER_LABEL_ENABLE=true
    command: --interval 30 --label-enable product-api-prod
    networks:
      - product-prod-network

# ==============================================================================
# Persistent Storage & Production Network
# ==============================================================================
volumes:
  mongodb_prod_data:
    name: nammongodb_prod_data

networks:
  product-prod-network:
    name: product-prod-network
    driver: bridge
