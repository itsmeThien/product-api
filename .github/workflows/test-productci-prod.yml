name: Test Product CI Production Ready (with MongoDB Service)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-crud-with-mongodb:
    name: Test Full CRUD & Healthcheck on GitHub Actions
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Integration Tests with Live MongoDB
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/product_db_test
        run: npm test

      - name: Start API & Verify Live /health Endpoint
        env:
          PORT: 5000
          NODE_ENV: production
          MONGODB_URI: mongodb://localhost:27017/product_db
        run: |
          node src/server.js &
          API_PID=$!
          echo "Started API with PID: $API_PID. Waiting 5s for startup..."
          sleep 5
          echo "Calling /health endpoint..."
          curl -s -f http://localhost:5000/health | jq .
          echo "Killing temporary server..."
          kill $API_PID

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: product-api:test
